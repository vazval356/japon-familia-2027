name: Publicar guía en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minificar CSS y JS
        run: |
          npx --yes esbuild@0.24.0 site/assets/js/app.js  --minify --target=es2019 --allow-overwrite --outfile=site/assets/js/app.js
          npx --yes esbuild@0.24.0 site/assets/js/data.js --minify --target=es2019 --allow-overwrite --outfile=site/assets/js/data.js
          npx --yes esbuild@0.24.0 site/assets/css/app.css --minify --allow-overwrite --outfile=site/assets/css/app.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
